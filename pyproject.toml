[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ux-evidence-graph"
version = "0.1.0"
description = "Turn unstructured UX text into a reviewable evidence graph for higher-level reasoning. Runs locally with LM Studio."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Mohsen Rafiei, Ph.D." }]
keywords = ["ux-research", "evidence-graph", "rag", "graph-rag", "lm-studio", "qualitative-analysis"]

dependencies = [
    "openai>=1.0.0",
    "pydantic>=2.0.0",
    "python-dotenv>=1.0.0",
    "pyyaml>=6.0",
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    "networkx>=3.0",
    "scikit-learn>=1.3.0",
    "sentence-transformers>=2.2.0",
    "pypdf>=3.0.0",
    "rich>=13.0.0",
    "matplotlib>=3.7.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.0.0"]

[project.scripts]
uxeg = "uxeg.cli:main"

[tool.setuptools.packages.find]
include = ["uxeg*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
